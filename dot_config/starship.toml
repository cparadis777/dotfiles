# Fast, clean, powerline-style prompt
add_newline = true

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

[directory]
truncation_length = 3
style = "bold cyan"
fish_style_pwd_dir_length = 1

[git_branch]
style = "bold yellow"

[mise]
disabled = false

[line_break]
disabled = false
